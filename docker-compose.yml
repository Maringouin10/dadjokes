services:
  dadjokes:
    build: .
    container_name: dadjokes
    ports:
      - "8002:8002"
    volumes:
      - dadjokes-data:/data
    # Tous les réglages viennent du fichier .env (voir .env.example pour la liste complète)
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  dadjokes-data:
