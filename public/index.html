<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blague du jour</title>
  <meta name="description" content="Une nouvelle blague plate chaque jour : à midi en semaine, à minuit le week-end (heure de New York).">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Blague du jour">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow" id="date">Aujourd’hui</p>
      <h1 class="title">La blague plate du jour</h1>
    </header>

    <article class="card" aria-live="polite" aria-busy="true" id="card">
      <p class="joke" id="joke"><span class="placeholder">Chargement de la blague du jour…</span></p>
    </article>

    <div class="flip" id="flip" role="button" tabindex="0" aria-pressed="false" hidden
         aria-label="Retourner la carte pour voir la réponse">
      <div class="flip-inner" id="flip-inner">
        <div class="face front card" id="front">
          <p class="joke" id="setup"></p>
          <p class="hint" aria-hidden="true">Glisse pour la réponse <span class="chevron">›</span></p>
        </div>
        <div class="face back card" id="back" aria-hidden="true">
          <p class="joke" id="punchline"></p>
          <p class="hint" aria-hidden="true"><span class="chevron">‹</span> Glisse pour revenir</p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="button" id="share" type="button" hidden>Partager</button>
      <button class="button secondary" id="push" type="button" aria-pressed="false" hidden>Notifications</button>
      <button class="button secondary" id="email" type="button" hidden>E-mail</button>
    </div>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>

    <p class="next" id="next"></p>
  </main>

  <footer class="footer">
    <p id="source">&nbsp;</p>
  </footer>

  <dialog class="sheet" id="email-dialog" aria-labelledby="email-title">
    <form class="sheet-form" id="email-form" novalidate>
      <h2 class="sheet-title" id="email-title">La blague par e-mail</h2>
      <p class="sheet-text">Reçois la blague plate du jour dans ta boîte mail : à midi en semaine, à minuit le week-end (heure de New York).</p>
      <label class="visually-hidden" for="email-input">Adresse e-mail</label>
      <input class="field" id="email-input" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="toi@exemple.com" required maxlength="254">
      <p class="sheet-status" id="email-status" role="status" aria-live="polite"></p>
      <div class="sheet-actions">
        <button class="button secondary" type="button" id="email-cancel">Annuler</button>
        <button class="button" type="submit" id="email-submit">S’abonner</button>
      </div>
    </form>
  </dialog>

  <script src="/flip-animations.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
