<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dad Jokes</title>
  <meta name="description" content="One new dad joke every day, at midnight New York time.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dad Jokes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow" id="date">Today</p>
      <h1 class="title">Dad Joke of the Day</h1>
    </header>

    <article class="card" aria-live="polite" aria-busy="true" id="card">
      <p class="joke" id="joke"><span class="placeholder">Loading today's joke…</span></p>
    </article>

    <div class="actions">
      <button class="button" id="share" type="button" hidden>Share</button>
    </div>

    <p class="next" id="next"></p>
  </main>

  <footer class="footer">
    <p id="source">&nbsp;</p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
